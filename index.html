<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOP Generator Pro</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head><body><header><small>DESKTOP PROCEDURE STUDIO</small><h1>SOP Generator Pro</h1><p>Create a polished desktop procedure and download a real Microsoft Word document.</p></header><main><section id="editor"><div class="card"><h2>1. Document control</h2><div class="grid"><label class="wide">Procedure title<input id="title" value="Monthly Reporting Procedure"></label><label>Owner / team<input id="owner" value="Regulatory Reporting / Revenue Requirement"></label><label>Systems / tools<input id="systems" value="Excel / Oracle Fusion / FDI"></label><label>Frequency<input id="frequency" value="Monthly"></label><label>Version<input id="version" value="Draft 0.1"></label><label class="wide">Prepared by<input id="prepared"></label><label class="wide">Purpose<textarea id="purpose"></textarea></label><label class="wide">Scope<textarea id="scope"></textarea></label><label class="wide">Prerequisites, one per line<textarea id="prereq">Confirm access to required systems and source files.
Use the current approved template.
Do not overwrite approved prior-period records.</textarea></label></div></div><div class="card"><h2>2. Procedure steps</h2><div id="steps"></div><button id="add" class="full">+ Add another step</button></div><div class="card"><h2>3. Controls and support</h2><label>Controls, validation, exceptions, and escalation<textarea id="controls"></textarea></label><label>Troubleshooting, one item per line<textarea id="trouble"></textarea></label><label>Output and retention, one item per line<textarea id="retention">Save the final output using the approved naming convention.
Retain source reports, reconciliations, explanations, and review evidence.</textarea></label></div><button id="generate" class="primary full">Generate preview</button></section><aside><div class="bar"><b>SOP preview</b><button id="word">Download Word (.docx)</button></div><div id="notice"></div><div id="preview" class="paper"><div class="empty">Add at least one instruction, then generate the preview.</div></div></aside></main></body></html>
